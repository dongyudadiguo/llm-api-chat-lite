<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chat Lite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
<script>
document.documentElement.dataset.theme =
  localStorage.getItem('acl:theme') ||
  (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark')
</script>
<style>
:root{
  color-scheme:dark;
  --bg:#09090b;--s:#131316;--s2:#202026;--b:#2d2d34;
  --t:#eee;--t2:#999;--t3:#666;--a:#3b82f6;--d:#ef4444;
  --r:10px;--glass:rgba(19,19,22,.86);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f5f5f7;--s:#fff;--s2:#eeeef1;--b:#d8d8df;
  --t:#18181b;--t2:#71717a;--t3:#a1a1aa;--a:#2563eb;
  --glass:rgba(255,255,255,.88)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t);font-size:15px}
body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#side{
  position:fixed;inset:0 auto 0 0;width:260px;background:var(--s);
  border-right:1px solid var(--b);z-index:20;transform:translateX(-100%);
  transition:.2s;display:flex;flex-direction:column
}
#side.on{transform:none}
.side-h,.side-f{padding:14px;border-bottom:1px solid var(--b)}
.side-f{border-top:1px solid var(--b);border-bottom:0}
#list{flex:1;overflow:auto;padding:8px}
.conv{padding:10px;border-radius:var(--r);cursor:pointer;margin-bottom:4px}
.conv:hover,.conv.on{background:var(--s2)}
.conv b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv small{color:var(--t2)}
.conv .ops{display:none;margin-top:6px;gap:6px}
.conv:hover .ops{display:flex}
.btn,.icon{
  border:1px solid var(--b);background:var(--s2);border-radius:var(--r);
  padding:7px 12px;color:var(--t2)
}
.btn:hover,.icon:hover{background:var(--b);color:var(--t)}
.btn.primary{background:var(--a);border-color:var(--a);color:white}
.btn.danger{color:var(--d)}
.icon{
  width:36px;height:36px;padding:0;display:grid;place-items:center;
  background:var(--glass);backdrop-filter:blur(14px)
}
.top-l,.top-r{position:fixed;top:12px;z-index:10}
.top-l{left:12px}
.top-r{right:12px;display:flex;gap:6px}
#status{
  position:fixed;top:55px;left:12px;z-index:9;color:var(--t2);
  background:var(--glass);border-radius:6px;padding:4px 9px;font-size:12px;
  max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#msgs{position:fixed;inset:0;overflow:auto;padding:72px 12px 150px}
.stack{width:min(780px,100%);margin:auto;display:flex;flex-direction:column;gap:24px}
.empty{min-height:55vh;display:grid;place-items:center;text-align:center;color:var(--t2)}
.msg{display:flex;flex-direction:column;gap:7px}
.msg.hidden{opacity:.45}
.hd{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:13px}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--s2);font-weight:700;font-size:11px}
.user .av{background:#172554;color:#60a5fa}
.tm{margin-left:auto;font-size:12px;color:var(--t3)}
.tag{font-size:12px;color:var(--t2);background:rgba(128,128,128,.1);padding:2px 7px;border-radius:5px}
.tag.trim{color:var(--a)}
.mini{font-size:12px;color:var(--t2);padding:2px 6px;border-radius:5px}
.mini:hover{background:var(--s2);color:var(--t)}
.bd{
  border-radius:12px;line-height:1.75;word-break:break-word;
  padding:11px 14px;background:var(--s);border:1px solid var(--b)
}
.assistant .bd{background:transparent;border:0;padding-left:30px}
.error .bd{background:#2a1215;border-color:#3a1a1e;color:var(--d)}
.bd p,.bd ul,.bd ol,.bd pre,.bd blockquote,.bd h1,.bd h2,.bd h3{margin:0 0 10px}
.bd>:last-child{margin-bottom:0}
.bd ul,.bd ol{padding-left:22px}
.bd code{font-family:Menlo,Consolas,monospace;background:rgba(128,128,128,.12);padding:1px 5px;border-radius:4px}
.bd a{color:var(--a)}
.code{position:relative;margin:0 0 10px}
.code pre{
  overflow:auto;background:var(--s);border:1px solid var(--b);
  border-radius:var(--r);padding:14px;font-family:Menlo,Consolas,monospace;font-size:13px
}
.code button{
  position:absolute;right:8px;top:8px;font-size:12px;z-index:5;
  border:1px solid var(--b);border-radius:6px;padding:3px 8px;
  background:var(--glass);color:var(--t2)
}
.code[data-ed] pre{display:none}
.code .monaco-editor,.code .monaco-editor .margin,.code .monaco-editor-background{background:transparent!important}
.restore{
  background:var(--s);border:1px solid var(--b);border-radius:var(--r);
  padding:9px 12px;color:var(--t2);font-size:13px
}
.restore button{color:var(--a)}
.dots span{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--t2);margin-right:5px;animation:b 1.2s infinite
}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
#form{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  width:min(820px,calc(100% - 24px));background:var(--glass);
  border:1px solid rgba(128,128,128,.16);border-radius:14px;
  backdrop-filter:blur(20px);overflow:hidden;z-index:8
}
#prompt{
  width:100%;min-height:48px;max-height:180px;resize:none;border:0;
  outline:0;background:transparent;padding:13px 16px 4px;line-height:1.6
}
.bar{display:flex;justify-content:space-between;align-items:center;padding:5px 10px 10px}
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;
  display:none;place-items:center;padding:20px
}
.modal-mask.on{display:grid}
.modal{
  width:min(580px,100%);background:var(--s);border:1px solid var(--b);
  border-radius:14px;overflow:hidden;max-height:88vh
}
.mh,.mf{padding:16px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}
.mf{border-top:1px solid var(--b);border-bottom:0}
.mb{padding:20px;display:grid;gap:14px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--t2);font-weight:600}
.inp{
  width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:var(--r);
  background:var(--s2);outline:0
}
textarea.inp{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--t3);line-height:1.6}
@media(max-width:700px){#side{width:280px}#msgs{padding-left:8px;padding-right:8px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<aside id="side">
  <div class="side-h"><b>对话</b></div>
  <div id="list"></div>
  <div class="side-f"><button class="btn" id="new2" style="width:100%">+ 新建</button></div>
</aside>

<button class="icon top-l" id="menu">☰</button>
<div class="top-r">
  <button class="icon" id="theme">☀</button>
  <button class="icon" id="syncBtn">☁</button>
  <button class="icon" id="setting">⚙</button>
  <button class="icon" id="new">＋</button>
</div>

<div id="status">就绪</div>
<main id="msgs"></main>

<form id="form">
  <textarea id="prompt" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <div class="bar">
    <span class="tag" id="modelTag">未配置</span>
    <button class="btn primary" id="send">发送</button>
  </div>
</form>

<div class="modal-mask" id="setMask">
  <div class="modal">
    <div class="mh">
      <b>设置</b>
      <button class="icon" id="closeSet" style="width:30px;height:30px">×</button>
    </div>
    <div class="mb grid">
      <div class="field full"><label>接口地址</label><input id="baseUrl" class="inp" placeholder="https://api.openai.com/v1"></div>
      <div class="field"><label>API Key</label><input id="apiKey" class="inp" type="password" placeholder="sk-..."></div>
      <div class="field"><label>模型</label><input id="model" class="inp" placeholder="gpt-4.1-mini"></div>
      <div class="field full"><label>系统提示词</label><textarea id="sys" class="inp"></textarea></div>
      <div class="field"><label>Temperature</label><input id="temp" class="inp" type="number" min="0" max="2" step="0.1"></div>
      <div class="field"><label>裁剪阈值字符数</label><input id="threshold" class="inp" type="number" min="10000" step="10000"></div>
      <div class="field full">
        <label><input id="autoTrim" type="checkbox" style="vertical-align:middle;margin-right:6px">启用 AI 自动裁剪上下文</label>
        <div class="hint">超过阈值后，会调用当前模型判断哪些历史轮次可隐藏；隐藏消息不会参与后续上下文。</div>
      </div>
    </div>
    <div class="mf">
      <span class="hint">兼容 OpenAI Chat Completions</span>
      <button class="btn primary" id="saveSet">保存</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="syncMask">
  <div class="modal" style="width:min(440px,100%)">
    <div class="mh">
      <div>
        <b>云同步</b>
        <div class="hint">通过私有 GitHub Gist 同步</div>
      </div>
      <button class="icon" id="closeSync" style="width:30px;height:30px">×</button>
    </div>
    <div class="mb">
      <div class="field">
        <label>GitHub Token</label>
        <input id="ghToken" class="inp" type="password" placeholder="ghp_xxx">
        <div class="hint">Token 需要 <b>gist</b> 权限。Token 只保存在本机；API Key 会进入私有 Gist。</div>
      </div>
      <div class="field">
        <label>状态</label>
        <span class="tag" id="syncStat">未配置</span>
      </div>
    </div>
    <div class="mf">
      <span></span>
      <button class="btn" id="doSync">立即同步</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
const $ = s => document.querySelector(s)
const K = {set:'acl:set',conv:'acl:conv',act:'acl:act',sync:'acl:sync',theme:'acl:theme'}
const def = {
  baseUrl:'https://api.openai.com/v1',
  apiKey:'',
  model:'gpt-4.1-mini',
  systemPrompt:'你是一个专业、准确、简洁的 AI 助手。',
  temperature:.7,
  autoTrim:true,
  threshold:60000
}
const read = (k,d) => {try{return JSON.parse(localStorage.getItem(k)) ?? d}catch{return d}}
const write = (k,v) => localStorage.setItem(k,JSON.stringify(v))
const now = () => new Date().toISOString()
const stamp = v => {let n = new Date(v || 0).getTime(); return isFinite(n) ? n : 0}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7)
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

let rawSet = read(K.set,null), rawConv = read(K.conv,null)
let S = Object.assign({},def,rawSet || {})
let C = Array.isArray(rawConv) ? rawConv : []
let Y = Object.assign({token:'',gist:'',localAt:'',remoteAt:''}, read(K.sync,{}))
let active = localStorage.getItem(K.act)
let ctl = null, raf = 0, applying = false
let monacoReady = false, editors = []

if (!Y.localAt && (rawSet || (Array.isArray(rawConv) && rawConv.some(c => c.messages?.length)))) Y.localAt = now()
if (!C.length) C = [newConvObj()]
if (!C.find(c => c.id === active)) active = C[0].id
write(K.conv,C); localStorage.setItem(K.act,active); saveY()

const U = {
  side:$('#side'), list:$('#list'), msgs:$('#msgs'), prompt:$('#prompt'), form:$('#form'),
  send:$('#send'), status:$('#status'), modelTag:$('#modelTag'),
  setMask:$('#setMask'), syncMask:$('#syncMask'), syncStat:$('#syncStat')
}

require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}})
require(['vs/editor/editor.main'], () => {
  monaco.editor.defineTheme('acl-dark',{base:'vs-dark',inherit:true,rules:[],colors:{
    'editor.background':'#09090b','editorGutter.background':'#09090b'
  }})
  monaco.editor.defineTheme('acl-light',{base:'vs',inherit:true,rules:[],colors:{
    'editor.background':'#f5f5f7','editorGutter.background':'#f5f5f7'
  }})
  monacoReady = true
  initMonaco()
})

bind()
refresh()
resize()
if (Y.token) scheduleSync(400)

function bind(){
  $('#menu').onclick = () => U.side.classList.toggle('on')
  $('#new').onclick = () => newConv()
  $('#new2').onclick = () => {newConv(); U.side.classList.remove('on')}
  $('#setting').onclick = openSet
  $('#closeSet').onclick = () => U.setMask.classList.remove('on')
  $('#saveSet').onclick = saveSet
  $('#theme').onclick = toggleTheme

  $('#syncBtn').onclick = openSync
  $('#closeSync').onclick = () => U.syncMask.classList.remove('on')
  $('#doSync').onclick = () => doSync()
  $('#ghToken').oninput = e => {
    Y.token = e.target.value.trim()
    if (!Y.token) Y.gist = ''
    saveY()
    syncUI(Y.token ? '已配置' : '未配置')
    if (Y.token) scheduleSync(500)
  }

  U.setMask.onclick = e => {if (e.target === U.setMask) U.setMask.classList.remove('on')}
  U.syncMask.onclick = e => {if (e.target === U.syncMask) U.syncMask.classList.remove('on')}

  U.form.onsubmit = send
  U.prompt.oninput = resize
  U.prompt.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      U.form.requestSubmit()
    }
  }

  U.list.onclick = e => {
    const item = e.target.closest('.conv')
    if (!item) return
    const id = item.dataset.id

    if (e.target.matches('.del')) {
      if (C.length <= 1) return stat('至少保留一个对话')
      C = C.filter(c => c.id !== id)
      if (active === id) active = C[0].id
      persist()
      return refresh()
    }

    if (e.target.matches('.ren')) {
      const c = conv(id), t = prompt('新标题：', c.title)
      if (t && t.trim()) {
        c.title = t.trim()
        c.updatedAt = now()
        persist()
        refreshList()
      }
      return
    }

    active = id
    localStorage.setItem(K.act,active)
    refresh()
    U.side.classList.remove('on')
  }

  U.msgs.onclick = e => {
    const cp = e.target.closest('[data-copy]')
    if (cp) {
      const pre = cp.parentElement.querySelector('pre')
      navigator.clipboard.writeText(pre?.innerText || '')
      cp.textContent = '已复制'
      setTimeout(() => cp.textContent = '复制', 1000)
      return
    }

    const hid = e.target.closest('[data-hide]')
    if (hid) {
      const m = findMsg(hid.dataset.hide)
      if (m) {
        m.hidden = !m.hidden
        m.autoHidden = false
        conv().updatedAt = now()
        persist()
        refresh()
      }
      return
    }

    if (e.target.closest('[data-restore]')) {
      conv().messages.forEach(m => {
        if (m.hidden) {
          m.hidden = false
          m.autoHidden = false
        }
      })
      conv().updatedAt = now()
      persist()
      refresh()
    }
  }
}

function newConvObj(){
  return {id:'c_'+uid(),title:'新对话',messages:[],createdAt:now(),updatedAt:now()}
}
function newConv(){
  C.unshift(newConvObj())
  active = C[0].id
  persist()
  refresh()
}
function conv(id=active){return C.find(c => c.id === id)}
function findMsg(id){return conv()?.messages.find(m => m.id === id)}
function msg(role,content=''){
  return {id:'m_'+uid(),role,content,time:now(),pending:false,error:false,hidden:false,autoHidden:false}
}
function touch(){
  if (applying) return
  Y.localAt = now()
  saveY()
  scheduleSync(1200)
}
function persist(){
  write(K.conv,C.map(c => ({
    ...c,
    messages:c.messages.filter(m => !m.pending)
  })))
  localStorage.setItem(K.act,active)
  touch()
}
function saveY(){write(K.sync,Y)}
function saveSetLocal(){
  write(K.set,S)
  touch()
}

function refresh(){
  refreshList()
  render()
  refreshInfo()
  initMonaco()
}
function refreshInfo(){
  U.modelTag.textContent = S.model || '未配置'
  U.send.textContent = ctl ? '停止' : '发送'
  $('#theme').textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '☾'
  syncUI(Y.token ? '已配置' : '未配置')
}
function refreshList(){
  U.list.innerHTML = C.map(c => `
    <div class="conv ${c.id===active?'on':''}" data-id="${c.id}">
      <b>${esc(c.title)}</b>
      <small>${c.messages.length} 条 · ${fmt(c.updatedAt)}</small>
      <div class="ops">
        <button class="btn ren">重命名</button>
        <button class="btn danger del">删除</button>
      </div>
    </div>
  `).join('')
}

function render(scroll=true){
  disposeMonaco()
  const c = conv(), ms = c?.messages || []
  const hiddenCount = ms.filter(m => m.hidden).length

  U.msgs.innerHTML = ms.length ? `
    <div class="stack">
      ${hiddenCount ? `<div class="restore">已隐藏 ${hiddenCount} 条消息，不参与上下文 <button data-restore>全部恢复</button></div>` : ''}
      ${ms.map(viewMsg).join('')}
    </div>
  ` : `
    <div class="stack">
      <div class="empty">
        <div>
          <h2>AI Chat Lite</h2>
          <p>配置接口后即可开始对话。</p>
        </div>
      </div>
    </div>
  `

  if (scroll) U.msgs.scrollTop = U.msgs.scrollHeight
}

function viewMsg(m){
  const isUser = m.role === 'user'
  const body = m.pending && !m.content
    ? `<div class="dots"><span></span><span></span><span></span></div>`
    : isUser
      ? `<p>${esc(m.content).replace(/\n/g,'<br>')}</p>`
      : md(m.content)

  return `
    <section class="msg ${isUser?'user':'assistant'} ${m.error?'error':''} ${m.hidden?'hidden':''}" data-id="${m.id}">
      <div class="hd">
        <span class="av">${isUser?'U':'AI'}</span>
        <b>${isUser?'你':'AI'}</b>
        ${m.hidden ? `<span class="tag ${m.autoHidden?'trim':''}">${m.autoHidden?'AI 裁剪':'已排除'}</span>` : ''}
        ${!m.pending ? `<button class="mini" data-hide="${m.id}">${m.hidden?'恢复':'排除'}</button>` : ''}
        <span class="tm">${time(m.time)}</span>
      </div>
      <div class="bd">${body}</div>
    </section>
  `
}

function md(src){
  src = String(src || '').replace(/\r/g,'')
  let out = '', i = 0, lines = src.split('\n')

  while (i < lines.length) {
    let line = lines[i]

    if (line.startsWith('```')) {
      const lang = line.slice(3).trim()
      let code = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) code.push(lines[i++])
      if (i < lines.length) i++
      out += `
        <div class="code" data-lang="${esc(lang)}">
          <button data-copy>复制</button>
          <pre><code>${esc(code.join('\n'))}</code></pre>
        </div>`
      continue
    }

    if (/^#{1,3}\s+/.test(line)) {
      const n = line.match(/^#+/)[0].length
      out += `<h${n}>${inline(line.replace(/^#{1,3}\s+/,''))}</h${n}>`
      i++
      continue
    }

    if (/^[-*+]\s+/.test(line)) {
      out += '<ul>'
      while (i < lines.length && /^[-*+]\s+/.test(lines[i])) {
        out += `<li>${inline(lines[i].replace(/^[-*+]\s+/,''))}</li>`
        i++
      }
      out += '</ul>'
      continue
    }

    if (!line.trim()) {
      i++
      continue
    }

    let p = []
    while (
      i < lines.length &&
      lines[i].trim() &&
      !lines[i].startsWith('```') &&
      !/^#{1,3}\s+/.test(lines[i]) &&
      !/^[-*+]\s+/.test(lines[i])
    ) p.push(lines[i++])

    out += `<p>${inline(p.join('\n')).replace(/\n/g,'<br>')}</p>`
  }

  return out || '<p></p>'
}
function inline(s){
  return esc(s)
    .replace(/$$([^$$]+)\]$(https?:\/\/[^\s)]+)$/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
}

async function send(e){
  e.preventDefault()

  if (ctl) {
    ctl.abort()
    return
  }

  const text = U.prompt.value.trim()
  if (!text) return

  if (!S.baseUrl || !S.apiKey || !S.model) {
    stat('请先配置接口')
    openSet()
    return
  }

  const c = conv()
  const u = msg('user', text)
  const a = Object.assign(msg('assistant',''), {pending:true})
  c.messages.push(u,a)
  c.updatedAt = now()
  if (c.title === '新对话') c.title = text.slice(0,20)

  U.prompt.value = ''
  resize()
  persist()
  refresh()

  try {
    await reply(a)
    ctl = null
    await trimAfterReply()
    stat('完成')
  } catch (err) {
    a.pending = false
    a.error = err.name !== 'AbortError'
    if (!a.content) a.content = err.name === 'AbortError' ? '已停止' : '请求失败：' + err.message
    stat(err.name === 'AbortError' ? '已停止' : '请求失败')
  } finally {
    ctl = null
    persist()
    refresh()
    U.prompt.focus()
  }
}

async function reply(ai){
  ctl = new AbortController()
  refreshInfo()
  stat('正在生成...')

  const messages = buildMsgs(ai.id)
  const body = {
    model:S.model,
    messages,
    temperature:Number(S.temperature ?? .7),
    stream:true
  }

  const res = await fetch(endpoint(), {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      Authorization:'Bearer ' + S.apiKey
    },
    body:JSON.stringify(body),
    signal:ctl.signal
  })

  if (!res.ok) throw new Error(await res.text() || 'HTTP ' + res.status)

  const ct = res.headers.get('content-type') || ''

  if (res.body && /event-stream/i.test(ct)) {
    await readSSE(res, t => {
      ai.content += t
      drawStream()
    })
  } else {
    const j = await res.json()
    ai.content = j.choices?.[0]?.message?.content || '接口返回为空'
  }

  ai.pending = false
  ai.error = false
}

function buildMsgs(skipId){
  const out = []
  if (S.systemPrompt) out.push({role:'system',content:S.systemPrompt})
  conv().messages.forEach(m => {
    if (m.pending || m.hidden || m.id === skipId) return
    if (m.role === 'user' || m.role === 'assistant') out.push({role:m.role,content:m.content})
  })
  return out
}
function endpoint(){
  const b = S.baseUrl.trim().replace(/\/+$/,'')
  if (/\/chat\/completions$/i.test(b)) return b
  if (/\/v1$/i.test(b)) return b + '/chat/completions'
  return b + '/v1/chat/completions'
}
function drawStream(){
  if (raf) return
  raf = requestAnimationFrame(() => {
    raf = 0
    render(true)
  })
}
async function readSSE(res,onText){
  const rd = res.body.getReader(), dec = new TextDecoder()
  let buf = ''

  while (true) {
    const {value,done} = await rd.read()
    if (done) break
    buf += dec.decode(value,{stream:true}).replace(/\r\n/g,'\n')
    let i
    while ((i = buf.indexOf('\n\n')) >= 0) {
      parseEvent(buf.slice(0,i),onText)
      buf = buf.slice(i+2)
    }
  }

  if (buf.trim()) parseEvent(buf,onText)
}
function parseEvent(ev,onText){
  ev.split('\n').forEach(line => {
    if (!line.startsWith('data:')) return
    const data = line.slice(5).trim()
    if (!data || data === '[DONE]') return
    try {
      const j = JSON.parse(data)
      const t = j.choices?.[0]?.delta?.content
      if (t) onText(t)
    } catch {}
  })
}

/* AI 自动裁剪上下文 */
function visibleChars(){
  return conv().messages.reduce((n,m) =>
    n + (!m.hidden && !m.pending ? (m.content || '').length : 0), 0
  )
}

async function trimAfterReply(){
  if (!S.autoTrim) return

  const threshold = Number(S.threshold || 60000)
  if (visibleChars() <= threshold) return

  stat('正在评估上下文...')

  let ids = []
  try {
    ids = await askTrimIds()
  } catch (e) {
    console.warn('AI 裁剪判断失败，使用兜底裁剪', e)
  }

  let n = applyTrim(ids)
  if (!n) n = fallbackTrim(threshold)

  if (n) {
    conv().updatedAt = now()
    persist()
    stat('已裁剪 ' + n + ' 条消息')
  } else {
    stat('无需裁剪')
  }
}

async function askTrimIds(){
  const data = conv().messages
    .filter(m => !m.hidden && !m.pending && ['user','assistant'].includes(m.role))
    .map(m => ({
      id:m.id,
      role:m.role,
      content:(m.content || '').slice(0,4000)
    }))

  const sys = `你是上下文裁剪器。判断哪些历史消息可以不再参与后续上下文。
规则：
1. 已被后文覆盖、重复、已解决的内容可以裁剪。
2. 用户明确要求、关键信息、当前任务相关内容不要裁剪。
3. 只返回 JSON：{"canHide":["消息id"]}`

  const body = {
    model:S.model,
    messages:[
      {role:'system',content:sys},
      {role:'user',content:JSON.stringify(data)}
    ],
    temperature:.1,
    max_tokens:200,
    stream:false
  }

  const r = await fetch(endpoint(), {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      Authorization:'Bearer ' + S.apiKey
    },
    body:JSON.stringify(body)
  })

  if (!r.ok) return []

  const j = await r.json()
  const text = j.choices?.[0]?.message?.content || ''
  const m = text.match(/\{[\s\S]*\}/)
  if (!m) return []

  const obj = JSON.parse(m[0])
  return Array.isArray(obj.canHide) ? obj.canHide : []
}

function hideTurnByIndex(i){
  const c = conv()
  if (!c) return 0

  while (i >= 0 && c.messages[i].role !== 'user') i--
  if (i < 0) return 0

  let n = 0

  for (let j = i; j < c.messages.length; j++) {
    if (j > i && c.messages[j].role === 'user') break

    const m = c.messages[j]
    if (!m.hidden && !m.pending) {
      m.hidden = true
      m.autoHidden = true
      n++
    }
  }

  return n
}

function applyTrim(ids){
  if (!Array.isArray(ids) || !ids.length) return 0

  const c = conv()
  let n = 0

  ids.forEach(id => {
    const i = c.messages.findIndex(m => m.id === id)
    if (i >= 0) n += hideTurnByIndex(i)
  })

  return n
}

function fallbackTrim(threshold){
  const c = conv()
  const users = []

  c.messages.forEach((m,i) => {
    if (m.role === 'user' && !m.hidden && !m.pending) users.push(i)
  })

  if (users.length <= 1) return 0

  let n = 0

  for (let i = 0; i < users.length - 1; i++) {
    if (visibleChars() <= threshold) break
    n += hideTurnByIndex(users[i])
  }

  return n
}

/* Monaco Editor */
const MOPTS = {
  readOnly:true,
  domReadOnly:true,
  minimap:{enabled:false},
  scrollBeyondLastLine:false,
  lineNumbers:'off',
  folding:false,
  wordWrap:'on',
  fontSize:13,
  fontFamily:'Menlo,Consolas,monospace',
  scrollbar:{
    vertical:'auto',
    horizontal:'auto',
    verticalScrollbarSize:6,
    horizontalScrollbarSize:6
  },
  overviewRulerLanes:0,
  renderLineHighlight:'none',
  contextmenu:false,
  automaticLayout:true,
  padding:{top:8,bottom:8}
}

function monacoTheme(){
  return document.documentElement.dataset.theme === 'light' ? 'acl-light' : 'acl-dark'
}

function mapLang(l){
  const m = {
    js:'javascript',
    ts:'typescript',
    py:'python',
    sh:'shell',
    bash:'shell',
    zsh:'shell',
    yml:'yaml',
    md:'markdown',
    cs:'csharp',
    rb:'ruby',
    rs:'rust',
    vue:'html'
  }

  return m[(l || '').toLowerCase()] || l || 'plaintext'
}

function disposeMonaco(){
  editors.forEach(ed => {
    try { ed.dispose() } catch {}
  })
  editors = []
}

function initMonaco(){
  if (!monacoReady) return

  document.querySelectorAll('.code:not([data-ed])').forEach(el => {
    const pre = el.querySelector('pre')
    if (!pre) return

    const text = pre.innerText.replace(/\n$/,'')
    const lang = el.dataset.lang || ''

    el.dataset.ed = '1'
    pre.style.display = 'none'

    const div = document.createElement('div')
    div.style.height = Math.min(text.split('\n').length * 18 + 24, 420) + 'px'
    el.appendChild(div)

    try {
      const ed = monaco.editor.create(div, Object.assign({
        value:text,
        language:mapLang(lang),
        theme:monacoTheme()
      }, MOPTS))

      editors.push(ed)
    } catch (e) {
      pre.style.display = ''
      div.remove()
      delete el.dataset.ed
    }
  })
}

window.addEventListener('beforeunload', disposeMonaco)

/* GitHub Gist 云同步 */
let syncTimer = 0
let syncing = false
let syncAgain = false

function openSync(){
  $('#ghToken').value = Y.token || ''
  syncUI(Y.token ? '已配置' : '未配置')
  U.syncMask.classList.add('on')

  if (Y.token) scheduleSync(0)
}

function syncUI(t){
  const s = t || (Y.token ? '已配置' : '未配置')

  U.syncStat.textContent = s

  const btn = $('#syncBtn')

  if (s.includes('同步中')) btn.style.color = '#f59e0b'
  else if (s.includes('失败')) btn.style.color = 'var(--d)'
  else if (s.includes('已同步')) btn.style.color = '#4ade80'
  else btn.style.color = ''
}

function scheduleSync(delay=1200){
  if (applying) return

  clearTimeout(syncTimer)

  if (!Y.token) {
    syncUI('未配置')
    return
  }

  if (ctl) {
    syncAgain = true
    syncUI('生成后同步')
    return
  }

  syncTimer = setTimeout(doSync, delay)
}

async function doSync(){
  clearTimeout(syncTimer)

  if (!Y.token) {
    syncUI('未配置')
    return
  }

  if (ctl) {
    syncAgain = true
    syncUI('生成后同步')
    return
  }

  if (syncing) {
    syncAgain = true
    return
  }

  syncing = true
  syncAgain = false
  syncUI('同步中…')

  try {
    let gid = Y.gist

    if (!gid) {
      const found = await findGist()
      gid = found?.id
    }

    if (!gid) {
      const created = await createGist()
      gid = created.id
    }

    Y.gist = gid
    saveY()

    const remote = await readGist(gid)

    if (remote && stamp(remote.updatedAt || remote.ts) > stamp(Y.localAt)) {
      applyRemote(remote)
    }

    if (!Y.localAt) {
      Y.localAt = now()
      saveY()
    }

    const payload = {
      app:'ai-chat-lite',
      settings:S,
      conversations:C.slice(0,50),
      theme:localStorage.getItem(K.theme) || document.documentElement.dataset.theme,
      updatedAt:Y.localAt,
      ts:now()
    }

    await ghAPI('gists/' + gid, 'PATCH', {
      files:{
        'sync.json':{
          content:JSON.stringify(payload)
        }
      }
    })

    Y.remoteAt = payload.updatedAt
    saveY()

    syncUI('已同步')
    stat('已同步')
  } catch (e) {
    console.error('sync error:', e)

    let msg = e.message || String(e)

    if (e.status === 401) msg = 'Token 无效或已过期'
    if (e.status === 403) msg = 'Token 没有 gist 权限，或 GitHub API 限流'

    syncUI('同步失败')
    stat('同步失败：' + msg)
  } finally {
    syncing = false
    if (syncAgain) scheduleSync(800)
  }
}

async function ghAPI(path, method='GET', body){
  const headers = {
    Authorization:'Bearer ' + Y.token,
    Accept:'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }

  if (body) headers['Content-Type'] = 'application/json'

  const r = await fetch('https://api.github.com/' + path, {
    method,
    headers,
    body:body ? JSON.stringify(body) : undefined
  })

  const text = await r.text()
  let data = null

  if (text) {
    try { data = JSON.parse(text) }
    catch { data = text }
  }

  if (!r.ok) {
    const err = new Error(data?.message || text || ('HTTP ' + r.status))
    err.status = r.status
    err.data = data
    throw err
  }

  return data
}

async function findGist(){
  for (let p = 1; p <= 10; p++) {
    const list = await ghAPI('gists?per_page=100&page=' + p)

    const g = list.find(x =>
      x.description === 'AI Chat Lite Sync' &&
      x.files &&
      x.files['sync.json']
    )

    if (g) return g
    if (!Array.isArray(list) || list.length < 100) break
  }

  return null
}

function createGist(){
  return ghAPI('gists', 'POST', {
    description:'AI Chat Lite Sync',
    public:false,
    files:{
      'sync.json':{
        content:'{}'
      }
    }
  })
}

async function readGist(gid){
  const g = await ghAPI('gists/' + gid)
  const f = g.files?.['sync.json']

  if (!f) return {}

  let raw = f.content || '{}'

  if (f.truncated && f.raw_url) {
    const r = await fetch(f.raw_url + '?t=' + Date.now(), {
      cache:'no-store'
    })

    raw = await r.text()
  }

  try {
    return JSON.parse(raw || '{}')
  } catch {
    return {}
  }
}

function normMsg(m){
  return {
    id:m.id || 'm_' + uid(),
    role:m.role === 'assistant' ? 'assistant' : 'user',
    content:String(m.content || ''),
    time:m.time || now(),
    pending:false,
    error:!!m.error,
    hidden:!!m.hidden,
    autoHidden:!!m.autoHidden
  }
}

function normConvs(arr){
  return (arr || [])
    .filter(c => c && c.id && Array.isArray(c.messages))
    .map(c => ({
      id:c.id,
      title:c.title || '新对话',
      messages:c.messages
        .filter(m => ['user','assistant'].includes(m.role))
        .map(normMsg),
      createdAt:c.createdAt || now(),
      updatedAt:c.updatedAt || now()
    }))
    .sort((a,b) => stamp(b.updatedAt) - stamp(a.updatedAt))
}

function applyRemote(remote){
  applying = true

  try {
    if (remote.settings) {
      S = Object.assign({}, def, remote.settings)
      write(K.set,S)
    }

    if (Array.isArray(remote.conversations)) {
      C = normConvs(remote.conversations)

      if (!C.length) C = [newConvObj()]

      if (!C.find(c => c.id === active)) active = C[0].id

      write(K.conv,C)
      localStorage.setItem(K.act,active)
    }

    if (/^(dark|light)$/.test(remote.theme || '')) {
      document.documentElement.dataset.theme = remote.theme
      localStorage.setItem(K.theme, remote.theme)

      if (monacoReady) monaco.editor.setTheme(monacoTheme())
    }

    Y.localAt = remote.updatedAt || remote.ts || now()
    Y.remoteAt = Y.localAt
    saveY()

    refresh()
  } finally {
    applying = false
  }
}

}
