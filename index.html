<style>

.msg-hide{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;padding:1px 6px;border-radius:4px;opacity:0}.msg:hover .msg-hide{opacity:1}.msg-hide:hover{color:var(--t2);background:var(--s2)}
.sep{border:none;height:1px;background:var(--b);margin:8px 0}.msg-bd.collapsed{max-height:var(--ch);overflow:hidden}.msg.u .msg-bd.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--s));pointer-events:none;border-radius:0 0 10px 10px}

.comp{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(800px,calc(100% - 24px));z-index:50;background:var(--glass);backdrop-filter:blur(20px);border:1px solid rgba(128,128,128,.08);border-radius:12px;overflow:hidden;transition:opacity .2s,transform .2s,visibility .2s}.comp.off{opacity:0;transform:translateX(-50%) translateY(8px);visibility:hidden;pointer-events:none}.comp.dual-active{border-color:rgba(168,85,247,.2)}.comp textarea{width:100%;min-height:44px;max-height:180px;padding:13px 16px 4px;border:none;outline:none;background:transparent;resize:none;font-size:15px;line-height:1.6;color:var(--t)}.comp textarea::placeholder{color:var(--t3)}.c-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 10px}.c-info{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:rgba(128,128,128,.06);color:var(--t3);font-weight:500}.btn-s{padding:6px 18px;border-radius:var(--r);font-size:14px;font-weight:600;background:var(--a);color:#fff}.btn-s:hover{background:var(--a2)}.btn-s.stop{background:var(--d)}.btn-s.stop:hover{background:#dc2626}
.msg-bd p,.msg-bd ul,.msg-bd ol,.msg-bd h1,.msg-bd h2,.msg-bd h3,.msg-bd blockquote,.msg-bd table,.msg-bd hr{margin:0 0 10px}.msg-bd>:last-child{margin-bottom:0}.msg-bd ul,.msg-bd ol{padding-left:20px}.msg-bd blockquote{padding:8px 12px;border-left:3px solid var(--a);background:var(--s);border-radius:0 var(--r) var(--r) 0}.msg-bd h1{font-size:17px;font-weight:600}.msg-bd h2{font-size:16px;font-weight:600}.msg-bd h3{font-size:15px;font-weight:600}.msg-bd code{font-family:var(--m);font-size:.88em;padding:1px 5px;border-radius:4px;background:rgba(128,128,128,.08)}.msg-bd a{color:var(--a)}.msg-bd table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.6}.msg-bd thead th{text-align:left;padding:8px 12px;background:var(--s2);border:1px solid var(--b);font-weight:600;color:var(--t2);white-space:nowrap}.msg-bd tbody td{padding:7px 12px;border:1px solid var(--b);color:var(--t)}.msg-bd tbody tr:nth-child(even) td{background:rgba(128,128,128,.02)}.msg-bd hr{border:none;height:1px;background:var(--b)}
.cb{position:relative;margin:0 0 10px}.cb pre{margin:0;padding:14px;font-family:var(--m);font-size:13px;line-height:1.6;color:var(--t);overflow-x:auto}.cb pre code{padding:0;background:none;font-size:13px;border-radius:0;display:block}.cb[data-monaco] pre{display:none}.cb .cb-tools{position:absolute;top:6px;right:8px;display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .15s;z-index:20}.cb:hover .cb-tools{opacity:1}.cb .cb-tools button{font-size:12px;padding:3px 10px;border-radius:5px;background:var(--glass);backdrop-filter:blur(8px);color:var(--t2);border:1px solid rgba(128,128,128,.08);cursor:pointer}.cb .cb-tools button:hover{background:var(--s3);color:var(--t)}.cb .cb-tools .cb-lang{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.03em;text-transform:uppercase;pointer-events:none;padding-right:4px}.cb.nolang .cb-lang{display:none}.cb .monaco-editor,.cb .monaco-editor .margin,.cb .monaco-editor-background{background:transparent!important}.cb[data-monaco] .monaco-fade{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:10;border-radius:0 0 var(--r) var(--r)}.msg.pending .cb pre::after{content:'￮';color:var(--a);animation:cblink 1s step-end infinite;margin-left:1px}@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
.mm{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);display:grid;place-items:center;padding:20px}[data-theme=light] .mm{background:rgba(0,0,0,.25)}.mm.off{display:none}.modal{background:var(--s);border:1px solid var(--b);border-radius:12px;width:min(620px,100%);max-height:85vh;overflow-y:auto}.mh{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}.mh h2{font-size:16px;font-weight:600}.mh p{font-size:13px;color:var(--t3);margin-top:3px}.mb{padding:20px 24px}.mf{padding:14px 24px;border-top:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ff{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:600;color:var(--t2)}.hint{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.6}.hint code{background:var(--bg);padding:1px 4px;border-radius:3px;font-family:var(--m);font-size:12px}.ti,.ta{width:100%;padding:8px 11px;background:var(--s2);border:1px solid var(--b);border-radius:var(--r);color:var(--t);font-size:14px}.ti:focus,.ta:focus{outline:none;border-color:var(--a)}.ti::placeholder,.ta::placeholder{color:var(--t3)}.ta{min-height:76px;resize:vertical;line-height:1.6}.btn{padding:7px 14px;border-radius:var(--r);font-size:14px;font-weight:500;background:var(--s2);border:1px solid var(--b);color:var(--t2)}.btn:hover{background:var(--s3);color:var(--t)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-p{background:var(--a);color:#fff;border-color:var(--a)}.btn-p:hover{background:var(--a2)}.sw-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:10px 0;font-size:13px;color:var(--t2)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px}.sb-b::-webkit-scrollbar,.modal::-webkit-scrollbar{width:3px}

<body>
<div class="sb" id="sb"><div class="sb-h"><h3>对话</h3><button class="fab" id="sbX" style="width:28px;height:28px;font-size:12px">✕</button></div><div class="sb-b" id="convList"></div><div class="sb-f"><button class="btn-full" id="newConvBtn">+ 新建</button></div></div>
<button class="fab fab-l" id="menuBtn">☰</button>
<div class="fab-r"><button class="fab" id="themeBtn">☀</button><button class="fab" id="syncBtn">☁</button><button class="fab" id="setBtn">⚙</button><button class="fab" id="newBtn" style="font-size:18px;font-weight:300">+</button></div>
<div class="pill" id="status">就绪</div>
<div class="msgs" id="messages"></div>
<form class="comp" id="form" autocomplete="off"><textarea id="prompt" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><div class="c-bar"><div class="c-info"><span class="tag" id="mInfo">未配置</span></div><button class="btn-s" id="sendBtn">发送</button></div></form>
<div class="mm off" id="mask"><div class="modal"><div class="mh"><div><h2>设置</h2></div><button class="fab" id="maskX" style="width:28px;height:28px;font-size:12px">✕</button></div><div class="mb"><div class="fg"><div class="ff"><div class="field"><label>接口地址</label><input id="pUrl" class="ti" placeholder="https://api.openai.com/v1"></div></div><div class="field"><label>API Key</label><input id="pKey" class="ti" type="password" placeholder="sk-..."></div><div class="field"><label>模型</label><input id="pModel" class="ti" placeholder="gpt-4.1-mini"></div><div class="ff"><div class="field"><label>系统提示词</label><textarea id="pSys" class="ta" placeholder="你是一个专业、准确、简洁的 AI 助手。"></textarea></div></div><div class="field"><label>Temperature</label><input id="pTemp" class="ti" type="number" min="0" max="2" step="0.1"></div><div class="ff"><hr class="sep"></div><div class="ff"><div class="field"><label><input type="checkbox" id="pDualMode" style="vertical-align:middle;margin-right:6px">启用双模型模式（快速 + 深度思考）</label><span class="hint">同时向快速模型和思考模型发送请求。快速模型优先响应，思考模型一旦开始输出将立即接管并替换回答。</span></div></div><div class="ff" id="thinkFields" style="display:none"><div class="fg" style="margin-top:8px"><div class="ff"><div class="field"><label>思考模型 · 接口地址</label><input id="pThinkUrl" class="ti" placeholder="留空则使用主接口地址"></div></div><div class="ff"><div class="field"><label>思考模型 · API Key</label><input id="pThinkKey" class="ti" type="password" placeholder="留空则使用主 API Key"></div></div><div class="field"><label>思考模型 · 模型</label><input id="pThinkModel" class="ti" placeholder="o3, deepseek-r1, claude-sonnet-4-20250514"></div></div></div></div></div><div class="mf"><span class="hint">部分 API 需要后端代理</span><div style="display:flex;gap:8px"><button class="btn" id="maskC">取消</button><button class="btn btn-p" id="maskS">保存</button></div></div></div></div>
<div class="mm off" id="syncMask"><div class="modal" style="max-width:420px"><div class="mh"><div><h2>云同步</h2><p>通过 GitHub Gist 同步</p></div><button class="fab" id="syncX" style="width:28px;height:28px;font-size:12px">✕</button></div><div class="mb"><div class="field"><label>GitHub Token</label><input id="sToken" class="ti" type="password" placeholder="ghp_xxxx..."><span class="hint">Personal access tokens，勾选 <code>gist</code>，填写后自动生效</span></div><div class="sw-row"><span>同步状态</span><span id="sStat" class="tag">未配置</span></div></div><div class="mf"><span class="hint">Token 不上传云端；API Key 会上传到私有 Gist</span><div style="display:flex;gap:8px"><button class="btn" id="syncC">关闭</button><button class="btn btn-p" id="syncNow">立即同步</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
var monacoReady=false,theme=document.documentElement.dataset.theme,monacoEditors=[],monacoObserver=null;
require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'}});
require(['vs/editor/editor.main'],function(){
  monaco.editor.defineTheme('chat-dark',{base:'vs-dark',inherit:true,rules:[],colors:{'editor.background':'#09090b','editorGutter.background':'#09090b','editor.lineHighlightBackground':'#09090b','editor.selectionBackground':'#264f7833'}});
  monaco.editor.defineTheme('chat-light',{base:'vs',inherit:true,rules:[],colors:{'editor.background':'#f4f4f6','editorGutter.background':'#f4f4f6','editor.lineHighlightBackground':'#eeeef0','editor.selectionBackground':'#b6d6fb44'}});
  monacoReady=true;safeInitMonaco();
});
var MOPTS={readOnly:true,domReadOnly:true,minimap:{enabled:false},scrollBeyondLastLine:false,lineNumbers:'off',folding:false,wordWrap:'on',fontSize:13,fontFamily:"'Fira Code',Menlo,Consolas,'Courier New',monospace",fontLigatures:true,scrollbar:{vertical:'auto',horizontal:'auto',verticalScrollbarSize:6,horizontalScrollbarSize:6},overviewRulerLanes:0,hideCursorInOverviewRuler:true,overviewRulerBorder:false,renderLineHighlight:'none',contextmenu:false,padding:{top:8,bottom:8},lineDecorationsWidth:0,lineNumbersMinChars:0,automaticLayout:true,renderIndentGuides:true,guides:{indentation:true,bracketPairs:false}};
function curTheme(){return theme==='light'?'chat-light':'chat-dark'}
function mapLang(l){var m={js:'javascript',ts:'typescript',py:'python',rb:'ruby',rs:'rust',sh:'shell',bash:'shell',zsh:'shell',yml:'yaml',md:'markdown',cs:'csharp',kt:'kotlin',vue:'html',dockerfile:'dockerfile'};return m[(l||'').toLowerCase()]||l||'plaintext'}
function disposeMonaco(){if(!monacoEditors.length)return;monacoEditors.forEach(function(ed){try{ed.dispose()}catch(e){}});monacoEditors=[]}
window.addEventListener('beforeunload',disposeMonaco);
function initMonacoForEl(el){
  if(el.dataset.monaco)return;
  var pre=el.querySelector('pre');if(!pre)return;
  var text=pre.textContent.replace(/\n$/,'');
  var lang=el.dataset.lang||'';
  el.dataset.monaco='done';
  pre.style.display='none';
  var ediv=document.createElement('div');
  var h=Math.min(text.split('\n').length*18+16,400);
  ediv.style.height=h+'px';
  el.appendChild(ediv);
  if(h>400){var f=document.createElement('div');f.className='monaco-fade';el.appendChild(f)}
  try{var ed=monaco.editor.create(ediv,Object.assign({value:text,language:mapLang(lang),theme:curTheme()},MOPTS));monacoEditors.push(ed)}catch(e){pre.style.display='';ediv.remove();delete el.dataset.monaco}
}
function safeInitMonaco(scope){
  if(!monacoReady)return;
  var sel='.cb:not([data-monaco])';
  var els=scope?scope.querySelectorAll(sel):document.querySelectorAll('.msg:not(.pending) '+sel);
  if(!('IntersectionObserver' in window)){els.forEach(initMonacoForEl);return;}
  if(!monacoObserver){monacoObserver=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){var el=entry.target;if(el.dataset.monaco)return;initMonacoForEl(el);monacoObserver.unobserve(el)}})},{rootMargin:'200px'})}
  els.forEach(function(el){if(el.dataset.monaco)return;monacoObserver.observe(el)})
}
function forceInitMonaco(container){
  if(!monacoReady||!container)return;

async function rSSE(res,tCb,tcCb,onDone){
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='',done=false;
  try{
    while(true){
      var r=await rd.read();
      if(r.done)break;
      buf+=dec.decode(r.value,{stream:true}).replace(/\r\n/g,'\n');
      var i;
      while((i=buf.indexOf('\n\n'))!==-1){
        var ev=buf.slice(0,i);
        buf=buf.slice(i+2);
        if(procSSE(ev,tCb,tcCb,onDone)){
          done=true;
          break;
        }
      }
      if(done)break;
    }
    if(!done&&buf.trim())procSSE(buf,tCb,tcCb,onDone);
  }finally{
    try{rd.releaseLock();res.body.cancel()}catch(e){}
  }
}
function procSSE(ev,tCb,tcCb,onDone){
  var done=false;
  ev.split('\n').forEach(function(ln){
    if(!ln.startsWith('data:'))return;
    var t=ln.slice(5).trim();
    if(t==='[DONE]'){
      done=true;
      if(onDone)onDone();
      return;
    }
    if(!t)return;
    try{
      var j=JSON.parse(t),c=j.choices?.[0];
      if(c?.delta?.content&&tCb)tCb(c.delta.content);
      if(tcCb&&c?.delta?.tool_calls){c.delta.tool_calls.forEach(function(tc){tcCb(tc)})}
    }catch(e){}
  });
  return done;
}

function applyRemote(remote){if(S.ctl){updateSyncUI('error');return}_applyingRemote=true;try{var rd=remote.deletedConversations&&typeof remote.deletedConversations==='object'?remote.deletedConversations:{};Object.keys(rd).forEach(function(id){if(stamp(rd[id])>stamp(S.sy.d[id]))S.sy.d[id]=rd[id]});persistSy();if(remote.settings&&stamp(remote.settingsUpdatedAt||remote.ts)>stamp(S.sy.sa)){S.s=normSettings(migrateRaw(clone(remote.settings)));write(K.s,S.s);S.sy.sa=remote.settingsUpdatedAt||remote.ts||new Date().toISOString();persistSy()}if(Array.isArray(remote.conversations)){var map={};S.c.forEach(function(c){if(stamp(S.sy.d[c.id])<stamp(c.updatedAt))map[c.id]=c});remote.conversations.forEach(function(rc){if(!rc||!rc.id||!Array.isArray(rc.messages))return;var rt=stamp(rc.updatedAt);if(stamp(S.sy.d[rc.id])>=rt)return;map[rc.id]=mergeConv(map[rc.id],rc)});S.c=normConvs(Object.values(map)).sort(function(a,b){return stamp(b.updatedAt)-stamp(a.updatedAt)})}if(!S.c.length)mkConv();S.ac=S.c.find(function(x){return x.id===S.ac})?S.ac:S.c[0]?.id;persistConv();fillForm();renderConv();render();safeInitMonaco();refreshUI()}finally{_applyingRemote=false}}
async function readRemote(gid){var g=await ghAPI('gists/'+gid),f=g.files&&g.files['sync.json'];if(!f)return null;var raw=f.content||'{}';if(f.truncated&&f.raw_url){try{var rr=await fetch(f.raw_url+'?t='+Date.now(),{cache:'no-store'});if(!rr.ok)throw new Error('HTTP '+rr.status);raw=await rr.text()}catch(e){throw new Error('无法读取截断的 sync.json：'+e.message)}}try{return JSON.parse(raw||'{}')}catch(e){throw new Error('云端 sync.json 不是合法 JSON')}}
async function doSync(){if(!S.sy.t){updateSyncUI();return}if(_syncing)return;_syncing=true;updateSyncUI('syncing');try{var gid=S.sy.g||null;if(!gid){var found=await findSyncGist();if(found)gid=found.id}if(!gid){var created=await createSyncGist();gid=created.id}S.sy.g=gid;persistSy();var remote=null;try{remote=await readRemote(gid)}catch(e){if(e.status===404){S.sy.g='';persistSy();gid=null;var f2=await findSyncGist();if(f2)gid=f2.id;if(!gid){var c2=await createSyncGist();gid=c2.id}S.sy.g=gid;persistSy();remote=await readRemote(gid)}else throw e}var hasRemote=!!(remote&&(remote.settings||remote.theme||Array.isArray(remote.conversations)||remote.deletedConversations));if(hasRemote){applyRemote(remote);applyRemoteTheme(remote)}if(!S.sy.ta){S.sy.ta='1970-01-01T00:00:00.000Z';persistSy()}var cd=cleanD(S.sy.d||{});S.sy.d=cd;persistSy();await ghAPI('gists/'+gid,'PATCH',{files:{'sync.json':{content:JSON.stringify({app:'ai-chat-lite',settings:clone(S.s),settingsUpdatedAt:S.sy.sa||new Date().toISOString(),theme:localStorage.getItem(K.t)||theme,themeUpdatedAt:S.sy.ta,conversations:read(K.c,[]),deletedConversations:cd,ts:new Date().toISOString()})}}});updateSyncUI('ok');status(hasRemote?'已同步':'已创建云端同步并上传本地数据')}catch(e){updateSyncUI('error');var msg=e.message||String(e);if(e.status===401)msg='Token 无效或已过期';else if(e.status===403)msg='Token 没有 gist 权限，或 GitHub API 限流';status('同步失败：'+msg);console.error('sync:',e)}finally{_syncing=false}}
async function ghAPI(path,method,body){var headers={Authorization:'Bearer '+S.sy.t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(body)headers['Content-Type']='application/json';var opts={method:method||'GET',headers:headers};if(body)opts.body=JSON.stringify(body);var r=await fetch('https://api.github.com/'+path,opts),txt=await r.text(),data=null;if(txt){try{data=JSON.parse(txt)}catch(e){data=txt}}if(!r.ok){var err=new Error(data&&data.message?data.message:txt||('HTTP '+r.status));err.status=r.status;err.data=data;throw err}return data}
